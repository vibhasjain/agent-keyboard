name: Auto-update Claude Code CLI

# Daily: if a newer @anthropic-ai/claude-code is published, bump the pin in
# server/Dockerfile and redeploy. The CLI lives in the image rootfs (ephemeral
# on Fly — it resets to the image on every restart), so the only durable way to
# update it is to rebuild the image from a new pin. Each bump is a git commit,
# so the running version always matches what's in the repo and is easy to revert.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

# Share the deploy workflow's group so a scheduled update never overlaps a
# code-triggered deploy (two concurrent flyctl deploys to one app).
concurrency: agent-keyboard-deploy

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for a newer CLI version
        id: check
        run: |
          set -euo pipefail
          LATEST=$(npm view @anthropic-ai/claude-code version)
          CURRENT=$(grep -oE 'claude-code@[0-9.]+' server/Dockerfile | head -1 | cut -d@ -f2)
          echo "current=$CURRENT latest=$LATEST"
          if [ -z "$LATEST" ]; then echo "npm view returned nothing"; exit 1; fi
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already on the latest — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the pin
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sed -i "s#@anthropic-ai/claude-code@[0-9.]*#@anthropic-ai/claude-code@${{ steps.check.outputs.latest }}#" server/Dockerfile
          grep 'claude-code@' server/Dockerfile

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
        if: steps.check.outputs.changed == 'true'

      # Deploy BEFORE committing: if the build/deploy fails, the pin stays
      # unchanged in the repo and tomorrow's run retries. A successful deploy is
      # always followed by the matching commit below.
      - name: Deploy the rebuilt image
        if: steps.check.outputs.changed == 'true'
        run: flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Commit the bump
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "Agent Keyboard"
          git config user.email "actions@users.noreply.github.com"
          git add server/Dockerfile
          git commit -m "chore: auto-bump Claude Code CLI to ${{ steps.check.outputs.latest }}

          Automated daily update (.github/workflows/claude-code-autoupdate.yml).
          Deployed before commit, so the pin always reflects what's live."
          git pull --rebase origin main
          git push origin HEAD:main
