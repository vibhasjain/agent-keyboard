# Headless Codex CLI defaults for the Fly box — the GPT lane behind the
# fable-subagents skill and /codex:rescue. Written to $HOME/.codex/config.toml on
# EVERY boot (src/skills.ts seedCodexConfig), so edit it here, not on the volume:
# the volume copy is overwritten by the next deploy. Login (auth.json) is
# untouched. Owner decision 2026-09-05: GPT-6 Astra, highest effort, fast tier.
model = "gpt-6-astra"
model_reasoning_effort = "ultra"
service_tier = "fast"
approval_policy = "never"
sandbox_mode = "danger-full-access"

# One trust entry covers every checkout under /data.
[projects."/data"]
trust_level = "trusted"

[projects."/tmp"]
trust_level = "trusted"
