# Fly config for the Agent Keyboard server. To self-host, rename `app` to your
# own Fly app and create the volume it mounts:
#   fly apps create your-app
#   fly volumes create agent_data --region iad --size 3 -a your-app
#
# Everything owner-specific lives in Fly secrets, NOT here. Required:
#   fly secrets set CLAUDE_CODE_OAUTH_TOKEN=... SUPABASE_URL=... SUPABASE_ANON_KEY=... \
#     SUPABASE_SERVICE_KEY=... ALLOWED_EMAIL=... GH_TOKEN=... \
#     SITES='[{"id":"blog","repo":"https://github.com/you/blog.git","branch":"main","domain":"blog.example.com"}]'
# Optional: OPENAI_API_KEY (voice), GEMINI_API_KEY (image-gen skill),
# ALLOWED_USER_ID, EXTRA_ORIGINS. See SELF_HOSTING.md.
# Google viewers: GOOGLE_OAUTH_CLIENT_ID accepts one or comma-separated client IDs (with SESSION_SECRET).
# They may be Workspace (hd) accounts or ALLOWED_EMAIL/provisioned users; provisioned sites scopes apply
# to viewer routes, and GOOGLE_HD_SITES optionally confines Workspace viewers to listed site IDs.
app = "agent-keyboard"
primary_region = "iad"

# Build runs with the repo root as context (so the widget/ dir is available to
# the Dockerfile's widget stage):
#   flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Job scheduler: max concurrent Claude CLI jobs. Same-site jobs serialize on
  # the site lock regardless; this caps cross-site parallelism (memory-bound).
  AK_MAX_WORKERS = "3"
  HOME = "/data"
  IS_SANDBOX = "1"
  NODE_ENV = "production"
  # A streaming session holds its SITE's job lock while idle, so home (cv:/)
  # idling 3 min starved its own page agents (nutrition/movies/…) after a relay.
  # 45s keeps follow-ups snappy but hands the lock over quickly.
  AK_SESSION_IDLE_MS = "45000"
  # Volume fontconfig: chromium-headless-shell ignores $HOME font paths, so PDF
  # rendering (cv-jobs worker) resolves fonts via this conf on /data instead.
  FONTCONFIG_FILE = "/data/fontconfig/fonts.conf"
  CLAUDE_MODEL = "opus"
  # This deployment runs the 1M-context Opus variant — size the approximate
  # context gauge accordingly (the code default is 200k for standard windows).
  CONTEXT_WINDOW_TOKENS = "1000000"
  # This server's public base URL — used by the provision-user skill to point
  # invite emails at GET /welcome (must be in Supabase's allowed redirect URLs).
  AK_PUBLIC_URL = "https://agent-keyboard.fly.dev"
  # Workspace (hd) Google viewers may read ONLY these sites' feed/files. Unset
  # would mean every hypertrack.io account can read every site — including the
  # owner's private cv-jobs ledger — so this stays set. Not a secret.
  GOOGLE_HD_SITES = "closeout,closeout-jobs"
  # Branded-invite sender. Must be a verified Resend domain (the Fly host isn't
  # an email domain, so this can't be derived from AK_PUBLIC_URL).
  EMAIL_FROM = "Agent Keyboard <invites@agentkeyboard.com>"
  # LinkedIn-only residential egress: the owner's office iPad is a Tailscale exit
  # node; tailscale-up.sh pins it at boot and exposes SOCKS5 127.0.0.1:1055 for
  # the LinkedIn browsers. Pairs with the TS_AUTHKEY secret.
  TS_EXIT_NODE = "ipad-pro-12-9-6th-gen-wifi"
  GIT_AUTHOR_NAME = "Agent Keyboard"
  GIT_COMMITTER_NAME = "Agent Keyboard"
  GIT_AUTHOR_EMAIL = "agent@agentkeyboard.com"
  GIT_COMMITTER_EMAIL = "agent@agentkeyboard.com"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm so the in-process job registry + site mutex are always
  # available; the durable checkouts and session JSONLs persist on the volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Persistent volume holds HOME=/data: per-site git checkouts (FIXED cwd paths,
# session-hash stable) and the Claude Code session JSONLs (memory + compaction).
[[mounts]]
  source = "agent_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Safety valve for the occasional 2-CLI-jobs + headless-chromium overlap
# (worst realistic case ~1.2-1.4 GB of 2 GB). Bump memory to 4gb if OOM kills
# ever show up in `fly logs`.
swap_size_mb = 512
