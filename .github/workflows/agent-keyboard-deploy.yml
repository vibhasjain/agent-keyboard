name: Deploy agent-keyboard
on:
  push:
    branches: [main]
    paths: ["server/**", "widget/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: agent-keyboard-deploy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # superfly/flyctl-actions silently no-opped on 2026-09-11 — the step went
      # green having downloaded nothing, so the next step died on `flyctl:
      # command not found`. Install it ourselves (the same script the Dockerfile
      # uses) and prove it runs, so an upstream hiccup fails here, loudly.
      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh   # $HOME/.fly — /usr/local needs sudo on the runner
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version
      # Build context = repo root so the Dockerfile can bake widget/ into the image.
      # The target app comes from server/fly.toml, so forks deploy their own app unchanged.
      - run: flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Public image for one-click installs (Notes: 11 One-click self-host). Installer-made
  # instances run ghcr.io/<owner>/agent-keyboard:latest and "update yourself" redeploys it.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Same build as the Fly deploy: repo-root context so widget/ is baked in.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }},${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
